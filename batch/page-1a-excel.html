<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>엑셀로 최대 인원 입력</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <a href="index.html" class="logo-link">
        <div class="logo">
          <img src="https://www.kangwon.ac.kr/assets/ko/images/logos/logo-color.webp" alt="강원대학교" />
          <span class="label-status campus" style="color:white;background:#F1B337" aria-label="원주">원주</span>
          <strong>간호학과 실습 배치</strong>
        </div>
      </a>
    </header>

    <section class="hero">
      <div class="hero-content">
        <nav class="breadcrumbs" aria-label="경로">
          <a href="index.html">학기 선택</a>
          <span class="sep">&gt;</span>
          <a href="config.html">배치 입력</a>
          <span class="sep">&gt;</span>
          <a href="page-1a-method.html">입력 방식</a>
          <span class="sep">&gt;</span>
          <span>엑셀 업로드</span>
        </nav>
        <h1 class="page-main-title">엑셀로 최대 인원 입력</h1>
        <p class="page-description">템플릿을 내려받아 기간별 최대 인원을 작성한 뒤 업로드합니다.</p>
      </div>
    </section>

    <main class="content-grid">
      <section class="panel">
        <div class="panel-toolbar">
          <h2>1. 템플릿 다운로드</h2>
          <span id="selected-semester-info" class="semester-badge"></span>
        </div>
        <p class="muted">배치 입력에서 정한 기간 수와 기간별 반·학기에 맞춘 템플릿을 내려받습니다.</p>
        <div class="actions">
          <button type="button" id="download-template" class="btn primary" disabled>엑셀 템플릿 다운로드</button>
        </div>
      </section>

      <section class="panel">
        <div class="panel-toolbar">
          <h2>2. 작성한 파일 업로드</h2>
        </div>
        <label id="excel-upload-zone" class="json-upload-zone is-disabled" for="excel-file">
          <span class="json-upload-title">엑셀 파일 선택</span>
          <span id="excel-upload-name" class="muted">작성한 템플릿(.xlsx)을 올리면 내용을 확인한 뒤 요약 화면으로 넘어갑니다.</span>
        </label>
        <input id="excel-file" class="visually-hidden" type="file" accept=".xlsx" disabled />
        <p id="excel-message" class="muted">템플릿을 내려받아 작성한 뒤 업로드하세요.</p>
        <ul id="excel-errors" class="excel-errors hidden"></ul>
      </section>

      <div class="actions panel-actions">
        <a href="page-1a-method.html" class="btn">이전</a>
      </div>
    </main>

    <footer class="site-footer">
      <p>문의: codesensory@gmail.com</p>
    </footer>
  </div>

  <script src="js/batch-common.js"></script>
  <script src="js/xlsx-lite.js"></script>
  <script src="js/xlsx-lite-read.js"></script>
  <script src="js/excel-31.js"></script>
  <script src="js/excel-subject.js"></script>
  <script src="js/excel-32.js"></script>
  <script src="js/excel-41.js"></script>
  <script src="js/excel-42.js"></script>
  <script src="js/page-1a-excel.js"></script>
</body>
</html>
