<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>배치 입력 페이지</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <a href="index.html" class="logo-link">
        <div class="logo">
          <img src="https://www.kangwon.ac.kr/assets/ko/images/logos/logo-color.webp" alt="강원대학교" />
          <span class="label-status campus" style="color:white;background:#F1B337" aria-label="원주">원주</span>
          <strong>간호학과 실습 배치</strong>
        </div>
      </a>
    </header>

    <section class="hero">
      <div class="hero-content">
        <nav class="breadcrumbs" aria-label="경로">
          <a href="index.html">학기 선택</a>
          <span class="sep">&gt;</span>
          <span>배치 입력</span>
        </nav>
        <h1 class="page-main-title">학생 수와 실습 기간 입력</h1>
        <p class="page-description">반별 학생 수와 실습 기간 수를 넣고, 기간마다 실습하는 반을 고릅니다.</p>
      </div>
    </section>

    <main class="content-grid">
      <section class="panel">
        <div class="panel-toolbar">
          <h2>기본 정보</h2>
          <span id="selected-semester-info" class="semester-badge"></span>
        </div>

        <form id="config-form" autocomplete="off">
          <section class="config-step">
            <h3 class="config-step-title">1. 학생 수</h3>
            <div class="form-grid">
              <div class="field">
                <label class="field-label" for="num-a">A반 학생 수</label>
                <input id="num-a" name="numA" type="number" min="0" placeholder="예: 40" required />
              </div>
              <div class="field">
                <label class="field-label" for="num-b">B반 학생 수</label>
                <input id="num-b" name="numB" type="number" min="0" placeholder="예: 40" required />
              </div>
            </div>
          </section>

          <section class="config-step">
            <h3 class="config-step-title">2. 기간 수</h3>
            <p id="period-count-hint" class="muted"></p>
            <div id="period-counts" class="form-grid"></div>
          </section>

          <section class="config-step">
            <h3 class="config-step-title">3. 기간별 반</h3>
            <p class="muted">기간마다 실습하는 반을 누르세요. 묶음 오른쪽의 '한 번에' 버튼으로 같은 반을 한꺼번에 정할 수도 있습니다.</p>
            <div id="period-assignments" class="panel-inner"></div>
          </section>

          <p id="config-error" class="input-error-text hidden" role="alert"></p>

          <div class="actions">
            <a href="index.html" class="btn">이전</a>
            <a href="page-1a-method.html" id="go-1a" class="btn primary">다음 (입력 방식 선택)</a>
          </div>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <p>문의: codesensory@gmail.com</p>
    </footer>
  </div>

  <script src="js/batch-common.js"></script>
  <script src="js/config.js"></script>
</body>
</html>
