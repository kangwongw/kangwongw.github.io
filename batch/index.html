<!DOCTYPE html>

<body class="home">
  <div class="page-shell">
    <header class="site-header">
      <a href="index.html" class="logo-link">
        <div class="logo">
          <img src="https://www.kangwon.ac.kr/assets/ko/images/logos/logo-color.webp" alt="강원대학교" />
          <span class="label-status campus" style="color:white;background:#F1B337" aria-label="원주">원주</span>

    <section class="hero">

            <small>매뉴얼 PDF 보기</small>

    <main class="content-grid">

          <div class="semester-grid">
            <article class="semester-card" data-grade="3" data-semester="1" tabindex="0" role="button">

              <p>3학년 2학기 실습 배치</p>
            </article>
            <article class="semester-card" data-grade="4" data-semester="1" tabindex="0" role="button">
              <h3>4학년 1학기</h3>
              <p>4학년 1학기 실습 배치</p>
            </article>
            <article class="semester-card" data-grade="4" data-semester="2" tabindex="0" role="button">

          <div class="semester-actions">
            <a href="https://github.com/CodeSensory/CodeSensory.github.io/releases/latest/download/KNU_Wonju_Nursing_Placement.exe" download="KNU_Wonju_Nursing_Placement.exe" class="btn">

              JSON 수정
            </a>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p>문의: codesensory@gmail.com</p>
    </footer>

  <script src="js/batch-common.js"></script>
